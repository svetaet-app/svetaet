<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Светает — будильник с заданиями, который помогает встать. Установите приложение из Google Play или RuStore.">
  <meta name="theme-color" content="#102136">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Светает: умный будильник</title>
  <link rel="canonical" href="https://svetaet-app.github.io/svetaet/">
  <link rel="icon" type="image/png" href="site-icon.png">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #102136; background: #f8f9fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; min-height: 100vh; padding: clamp(24px, 7vh, 72px) 20px; background: linear-gradient(160deg, #f5f9fd, #fff8ef); }
    main { width: 100%; max-width: 600px; margin: 0 auto; padding: clamp(24px, 6vw, 48px); border: 1px solid #e2e6eb; border-radius: 28px; background: #fff; box-shadow: 0 14px 48px #10213609; overflow-wrap: anywhere; }
    .icon { display: block; width: 80px; height: 80px; border-radius: 20px; }
    .platform { margin: 22px 0 10px; color: #586677; font-size: 14px; line-height: 1.5; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 46px); line-height: 1.15; letter-spacing: -.025em; }
    .lead { margin: 18px 0 12px; max-width: 440px; font-size: clamp(21px, 4.5vw, 25px); line-height: 1.4; font-weight: 600; }
    .description { margin: 0; color: #586677; font-size: 17px; line-height: 1.65; }
    .stores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 28px 0 32px; }
    .store { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 13px 18px; border: 1px solid #102136; border-radius: 14px; background: #102136; color: #fff; text-align: center; text-decoration: none; font-size: 17px; line-height: 1.45; font-weight: 600; overflow-wrap: anywhere; }
    .store.secondary { background: #fff8ef; color: #102136; border-color: #d8b783; }
    a { color: #245278; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #0e7490; outline-offset: 5px; }
    .store:hover { background: #203b55; }
    .store.secondary:hover { background: #fff0d9; }
    .support { padding-top: 24px; border-top: 1px solid #e6e9ed; }
    h2 { margin: 0 0 8px; font-size: 16px; line-height: 1.5; font-weight: 600; }
    .email { display: inline-block; min-height: 44px; padding: 8px 0; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
    .documents { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 16px; }
    .documents a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 0; font-size: 15px; line-height: 1.5; }
    @media (max-width: 420px) { body { padding: 20px 12px; } main { border-radius: 22px; } .stores { grid-template-columns: 1fr; } }
    @media (forced-colors: active) { main, .store { border: 1px solid CanvasText; } }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="site-icon.png" width="80" height="80" alt="">
    <p class="platform">Для Android 9 и новее</p>
    <h1>Светает</h1>
    <p class="lead">Будильник с заданиями,<br>который помогает встать.</p>
    <p class="description">Выберите время, дни повтора, мелодию и задание.</p>
    <nav class="stores" aria-label="Установить приложение">
      <a class="store" href="https://play.google.com/store/apps/details?id=ru.wakeup.app">Google Play</a>
      <a class="store secondary" href="https://www.rustore.ru/catalog/app/ru.wakeup.app">RuStore</a>
    </nav>
    <section class="support" aria-labelledby="support-title">
      <h2 id="support-title">Поддержка</h2>
      <a class="email" href="mailto:svetaet.support@gmail.com">svetaet.support@gmail.com</a>
      <nav class="documents" aria-label="Документы приложения">
        <a href="privacy-policy.html">Политика конфиденциальности</a>
        <a href="terms-of-use.html">Условия использования</a>
      </nav>
    </section>
  </main>
</body>
</html>
